# Toolbit 工具目录（唯一事实来源 / Single Source of Truth）
#
# 该文件同时驱动：
#   - 后端：工具启用状态、限流档位、Body 上限、超时
#   - 前端：菜单、分类卡、搜索、工具页参数区
#   - 文档：docs/tools.md 与 docs/api/tools/*.md 的覆盖率校验
#   - 统计：分类维度
#
# 字段说明
#   slug            唯一标识，小写 kebab-case，路由与 API 路径使用
#   category        所属分类，取值见下方各分类块
#   order           分类内排序（从 1 开始，升序）
#   name            中文名称
#   nameEn          英文名称
#   enabled         是否启用；false 时端点返回 TOOL_DISABLED，前端隐藏入口
#   transport       json | multipart | websocket | client（client = 无后端端点）
#   rateClass       light | standard | heavy | file | network（限流档位）
#   maxBodyBytes    请求体上限（字节）
#   timeoutMs       服务端处理超时（毫秒）
#   sensitive       是否涉及密钥/证书等敏感材料（前端展示安全提示）
#   requiresNetwork 是否需要出网
#   autoRun         是否在参数变更后自动触发（默认 false）
#   wide            是否在 ≥1280px 宽度下使用左右分栏布局
#   i18nKey         前端词条命名空间（web/src/locales/<lang>/tools/<slug>.json）

