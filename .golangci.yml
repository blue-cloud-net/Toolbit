# golangci-lint 配置
#
# 架构约束由 depguard 强制：
#   仅 internal/cryptosvc 与 internal/pkisvc 允许导入 tongsuo-go
#   （见 AGENTS.md §4.1）。

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - whitespace
  settings:
    depguard:
      rules:
        tongsuo-go-only-in-crypto-layers:
          files:
            - "!**/internal/cryptosvc/**"
            - "!**/internal/pkisvc/**"
          deny:
            - pkg: "github.com/blue-cloud-net/tongsuo-go"
              desc: "tongsuo-go 只允许在 internal/cryptosvc 与 internal/pkisvc 中导入"
        # AGENTS.md §4.15：密码学运算一律经 cryptosvc 转调 tongsuo-go，
        # 禁止在 Toolbit 内用标准库拼装分组模式、填充、KDF、签名与密钥协商。
        #
        # 摘要（crypto/sha256 等）与随机源（crypto/rand）**不在**本规则内：
        # 前者用于内容指纹（目录 ETag），后者用于非密钥标识（requestId）。
        # 二者一旦用于密码学用途，仍属违规。
        no-stdlib-crypto:
          files:
            - "!**/internal/cryptosvc/**"
          deny:
            - pkg: "crypto/aes"
              desc: "密码学运算一律经 cryptosvc 转调 tongsuo-go"
            - pkg: "crypto/cipher"
              desc: "密码学运算一律经 cryptosvc 转调 tongsuo-go"
            - pkg: "crypto/des"
              desc: "密码学运算一律经 cryptosvc 转调 tongsuo-go"
            - pkg: "crypto/rc4"
              desc: "密码学运算一律经 cryptosvc 转调 tongsuo-go"
            - pkg: "crypto/hmac"
              desc: "密码学运算一律经 cryptosvc 转调 tongsuo-go"
            - pkg: "crypto/rsa"
              desc: "密码学运算一律经 cryptosvc 转调 tongsuo-go"
            - pkg: "crypto/ecdsa"
              desc: "密码学运算一律经 cryptosvc 转调 tongsuo-go"
            - pkg: "crypto/ed25519"
              desc: "密码学运算一律经 cryptosvc 转调 tongsuo-go"
            - pkg: "crypto/elliptic"
              desc: "密码学运算一律经 cryptosvc 转调 tongsuo-go"
            - pkg: "crypto/ecdh"
              desc: "密码学运算一律经 cryptosvc 转调 tongsuo-go"
            - pkg: "crypto/x509"
              desc: "X.509 处理一律经 pkisvc 转调 tongsuo-go"
    gocritic:
      disabled-checks:
        - ifElseChain
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/blue-cloud-net/Toolbit
  exclusions:
    generated: lax
